<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ink-symbol.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so a dark-theme reader
      // doesn't see a flash of the light page. useTheme takes over from here.
      try {
        document.documentElement.classList.add(
          localStorage.getItem("theme") === "dark" ? "dark" : "light",
        );
      } catch {
        document.documentElement.classList.add("light");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
